name: Blackduck scan

on: 
    workflow_dispatch:
## Please change the project name to your Blackdcuk project here
env:
     bd-project: BD-Scan 
     version: soprade1
  
jobs:
  build-scan:

    runs-on: [ self-hosted ]
    steps:
    - uses: actions/checkout@v2
   
    - uses: actions/setup-node@v1
      with:
        node-version: 16
    - run: npm install       
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: blackduck scan
      run: bash <(curl -s https://detect.synopsys.com/detect9.sh) 
           --blackduck.url=https://bdscan.i.mercedes-benz.com/
           --blackduck.api.token="${{secrets.BLACKDUCK_API_TOKEN}}"
           --detect.project.name="${{ env.bd-project}}"
           --detect.project.version.name="${{env.version}}"
           --detect.code.location.name=${{ env.bd-project}}-${{env.version}}-testing
           --detect.source.path="packages/ag-grid-enterprise/"

